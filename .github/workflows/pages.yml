name: Preview Little Joys Development on GitHub Pages
# Preview only the development branch's www directory; leave Netlify and main unchanged.

on:
  push:
    branches: [development/garden-fixes]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-development
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: development-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Little Joys
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the existing website
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
