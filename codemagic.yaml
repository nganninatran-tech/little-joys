workflows:
  little-joys-ios-preview:
    name: Little Joys + Widget iOS Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install Little Joys dependencies
        script: npm install
      - name: Generate iPhone project (Swift Package Manager)
        script: npx cap add ios --packagemanager SPM
      - name: Copy Little Joys into iOS
        script: npx cap sync ios
      - name: Add the Little Joys native widget target
        script: |
          gem install xcodeproj --no-document
          ruby setup_widget.rb
      - name: Build unsigned app and widget for iPhone simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
